# Proyecto/grupo propio para no chocar con otros contenedores
name: enfoque-qr

services:
  frontend:
    build:
      context: ../front
    ports:
      - "3004:3000"
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
      # El navegador llama al backend por el puerto del host (3009)
      - NEXT_PUBLIC_API_URL=http://localhost:3009
    volumes:
      - ../front:/app
      - /app/node_modules
    networks:
      - enfoque-net

  backend:
    build:
      context: ../backend
    ports:
      - "3009:3001"
    environment:
      - CHOKIDAR_USEPOLLING=true
      # El front ahora corre en localhost:3004: permitir su origen en CORS
      - CORS_ORIGINS=http://localhost:3004
      # Base pública usada para construir el QR del cliente (en dev = front local)
      - PUBLIC_WEB_URL=http://localhost:3004
    volumes:
      - ../backend:/app
      - /app/node_modules
    networks:
      - enfoque-net
    depends_on:
      - db

  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: enfoqueqr
      MYSQL_USER: enfoque
      MYSQL_PASSWORD: enfoquepass
    ports:
      - "3310:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - enfoque-net

volumes:
  db_data:

networks:
  enfoque-net:
    driver: bridge
